name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: todo-application
          path: target/todo-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  publish-image:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: publish-image
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to test server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            mkdir -p ~/todo
            cd ~/todo
            docker pull "$IMAGE"
            IMAGE="$IMAGE" docker compose up -d
            docker image prune -f

  notification:
    if: always()
    needs: [build-and-test, publish-image, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        run: |
          echo "## CI/CD result" >> "$GITHUB_STEP_SUMMARY"
          echo "Build and tests: ${{ needs.build-and-test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker image: ${{ needs.publish-image.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ needs.deploy.result }}" >> "$GITHUB_STEP_SUMMARY"

